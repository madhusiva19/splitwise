spring:
  application:
    name: splitwise

  datasource:
    url: jdbc:postgresql://ep-dry-cell-aytefoq2-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-base64-string-before-deploying}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000