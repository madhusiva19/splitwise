spring:
  application:
    name: splitwise

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Baseline existing schema"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  cors:
    # Comma-separated list of allowed origins. Override with CORS_ALLOWED_ORIGINS in any
    # environment where the frontend isn't on localhost:3000 (e.g. a deployed frontend URL).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  settle-up-digest:
    # Daily at 9am. A user only gets nudged once per stale period (see NotificationRepository),
    # so a shorter cron here would just detect staleness sooner, not spam more nudges.
    cron: ${SETTLE_UP_DIGEST_CRON:0 0 9 * * *}
    stale-after-days: ${SETTLE_UP_DIGEST_STALE_AFTER_DAYS:3}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000